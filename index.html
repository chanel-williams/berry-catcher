<!DOCTYPE html>
<html>

<head>
    <title>Berry Catcher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

    <div class="game-header">

        <div>
            <span>Time:</span>
            <strong class="timer">25</strong>
        </div>

        <h1>Berry Catcher</h1>

        <div>
    <span>Score:</span>
    <strong class="score">0</strong>
</div>

<div>
    <span>Best:</span>
    <strong class="best-score">0</strong>
</div>

    </div>

    <section class="game-area">

        <img src="basket.png" class="basket">

    </section>

    <p class="instructions">Swipe left and right to catch berries</p>
    <p class="game-over">
    Game Over!<br>
    Score: <span class="final-score">0</span><br>
    Best: <span class="final-best">0</span>
    </p>
    
    <button class="play-again">Play Again</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
